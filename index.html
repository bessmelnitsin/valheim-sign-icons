      const normalize = text =&gt; text.toLocaleLowerCase(&#x27;ru&#x27;).replace(/ё/g,&#x27;е&#x27;).replace(/\uFE0F/g,&#x27;&#x27;).trim();
      const preferred = [&#x27;🪨&#x27;,&#x27;🪵&#x27;,&#x27;🌲&#x27;,&#x27;🌳&#x27;,&#x27;🪶&#x27;,&#x27;🦴&#x27;,&#x27;💧&#x27;,&#x27;🌱&#x27;,&#x27;🌰&#x27;,&#x27;🔥&#x27;,&#x27;👁&#x27;,&#x27;🐗&#x27;,&#x27;🦌&#x27;,&#x27;🧌&#x27;,&#x27;⚔&#x27;,&#x27;🛡&#x27;,&#x27;🪖&#x27;,&#x27;🔨&#x27;,&#x27;🏹&#x27;,&#x27;🔩&#x27;,&#x27;⛏&#x27;,&#x27;🪓&#x27;,&#x27;🏆&#x27;,&#x27;💰&#x27;,&#x27;💎&#x27;,&#x27;🎒&#x27;,&#x27;📥&#x27;,&#x27;🌀&#x27;,&#x27;🏠&#x27;,&#x27;⛵&#x27;,&#x27;🧭&#x27;,&#x27;☠&#x27;];
